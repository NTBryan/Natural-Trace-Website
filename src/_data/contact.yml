section_label: "Contact"
title: "Contact our team"
subtitle: "Request a compatibility assessment or talk to our team about protecting a premium ingredient, verifying manufacturing partners, or investigating suspicious products."

info_items:
  - label: "Location"
    description: "Singapore"
  - label: "What We Do"
    description: "Supply chain traceability via NaturalTag&trade; integration. We tag your product at source and verify it downstream with NaturalDetect&trade;."

form:
  title: "Send Us a Message"
  subtitle: "Fill out the form below and our team will be in touch."
  first_name_label: "First Name"
  first_name_placeholder: "Your first name"
  last_name_label: "Last Name"
  last_name_placeholder: "Your last name"
  email_label: "Email"
  email_placeholder: "your@company.com"
  company_label: "Company"
  company_placeholder: "Your company name"
  inquiry_type_label: "Inquiry Type"
  inquiry_type_placeholder: "Select an inquiry type"
  message_label: "Message"
  message_placeholder: "Tell us about your project or requirements..."
  submit_text: "Send Message"

inquiry_types:
  - value: "NaturalTag Integration"
    label: "NaturalTag&trade; Integration"
  - value: "Supply Chain Traceability"
    label: "Supply Chain Traceability"
  - value: "Custom Strain Tagging"
    label: "Custom Strain Tagging"
  - value: "Partnership"
    label: "Partnership Inquiry"
  - value: "General"
    label: "General Inquiry"

success:
  title: "Message Sent"
  message: "Thank you for reaching out. Our team will review your inquiry and get back to you shortly."

# Shown when the message is handed to the visitor's email client instead of
# being submitted directly. This is the current behaviour until HubSpot is
# configured in _data/integrations.yml.
fallback:
  title: "One Last Step"
  message: "Your email client should now be open with your message ready to send. If nothing opened, email us directly at info@naturaltrace.com and we will pick it up from there."

# Shown if a direct submission is attempted and fails.
error:
  title: "Message Not Sent"
  message: "Something went wrong on our side. Please email us directly at info@naturaltrace.com and we will get back to you."

cta:
  section_label: "Get Started"
  title: "Start Your First Test Today"
  subtitle: "Schedule a consultation, discuss a compatibility project, or explore our testing capabilities."
  primary_text: "Contact Us &#8594;"
  primary_href: "mailto:info@naturaltrace.com"
  secondary_text: "View Services"
  secondary_href: "/services/"

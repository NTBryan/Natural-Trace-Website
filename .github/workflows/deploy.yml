name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions: read is required by actions/deploy-pages v4 and above. Without it the
# deploy job cannot read the build job's artifact, and it hangs until it aborts
# with "Timeout reached". That is exactly how run #21 failed on 6 Aug 2026.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx @11ty/eleventy
        env:
          NODE_ENV: production
          PATH_PREFIX: /Natural-Trace-Website/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
